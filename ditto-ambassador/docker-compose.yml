services:
  ditto-ambassador:
    build:
      context: .
      dockerfile: Dockerfile
    image: wodt/ditto-ambassador:local
    container_name: ditto-ambassador
    env_file:
      - ${AMBASSADOR_ENV_FILE:-.env}
    ports:
      - "${AMBASSADOR_PORT:-8081}:8081"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 4
